spring.application.name=Blog_App
server.port=

#DB configuration
spring.datasource.url=jdbc:mysql://localhost:3306/App_Database
spring.datasource.username=root
spring.datasource.password= ${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#updating tables in db
spring.jpa.hibernate.ddl-auto=update

#shows sql at console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Multipart file information
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

project.image=images/

project.ThisImageApp =imagesForThisApp/
project.TemporaryImageForThisApp = temporaryPost/

#Security data

#for debugging all security information
logging.level.org.springframework.security=DEBUG
spring.security.user.name=Harsh
spring.security.user.password=1234
#spring.security.user.roles=ADMIN

app.jwt.secret=myVeryLongJwtSecretKeyForMyBlogApplication123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890
app.jwt.expiration=18000000

#Razor pay keys
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

#gemini Api key

gemini.api.key = ${GEMINI_API_KEY}